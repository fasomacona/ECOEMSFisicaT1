<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Física Versus · CONAMAT</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    :root {
      --team-a: #7c3aed;
      --team-b: #f97316;
    }
    body { background: #0f0a1a; color: #f8fafc; min-height: 100vh; }
    .vs-wrap { max-width: 960px; margin: 0 auto; padding: 1rem 1rem 2.5rem; }

    /* Setup */
    .setup {
      text-align: center;
      padding: 2rem 1rem;
    }
    .setup h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      background: linear-gradient(90deg, #a78bfa, #fb923c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.4rem;
    }
    .setup .sub { color: #c4b5fd; margin-bottom: 1.5rem; }
    .name-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.8rem;
      align-items: center;
      margin-bottom: 1.2rem;
    }
    .name-row input {
      width: 100%;
      padding: 0.85rem 1rem;
      border-radius: 12px;
      border: 2px solid #4c1d95;
      background: #1e1b4b;
      color: white;
      font-size: 1.1rem;
      text-align: center;
      font-weight: 700;
    }
    .name-row input:focus { outline: none; border-color: #a78bfa; }
    .vs-badge {
      font-size: 1.6rem;
      font-weight: 900;
      color: #fbbf24;
    }
    .rounds-pick {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 1rem 0 1.5rem;
    }
    .rounds-pick button {
      padding: 0.55rem 1rem;
      border-radius: 999px;
      border: 2px solid #4c1d95;
      background: #1e1b4b;
      color: #e9d5ff;
      font-weight: 700;
      cursor: pointer;
    }
    .rounds-pick button.on {
      background: #7c3aed;
      border-color: #a78bfa;
      color: white;
    }
    .start-btn {
      background: linear-gradient(90deg, #7c3aed, #db2777);
      color: white;
      border: none;
      padding: 1rem 2.2rem;
      font-size: 1.2rem;
      font-weight: 800;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
    }
    .start-btn:hover { filter: brightness(1.08); }

    /* Scoreboard */
    .board {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0.6rem;
      align-items: stretch;
      margin-bottom: 1rem;
    }
    .team-box {
      border-radius: 14px;
      padding: 0.9rem 1rem;
      text-align: center;
      border: 3px solid transparent;
    }
    .team-box.a { background: rgba(124,58,237,0.25); border-color: var(--team-a); }
    .team-box.b { background: rgba(249,115,22,0.2); border-color: var(--team-b); }
    .team-box.active {
      box-shadow: 0 0 0 3px #fbbf24, 0 0 20px rgba(251,191,36,0.35);
    }
    .team-name { font-weight: 800; font-size: 1.05rem; margin-bottom: 0.2rem; }
    .team-box.a .team-name { color: #c4b5fd; }
    .team-box.b .team-name { color: #fdba74; }
    .team-score { font-size: 2.4rem; font-weight: 900; line-height: 1; }
    .mid-info {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 70px;
    }
    .round-label { font-size: 0.8rem; color: #a78bfa; font-weight: 700; }
    .round-num { font-size: 1.5rem; font-weight: 900; color: #fbbf24; }

    /* Question */
    .q-panel {
      background: #1e1b4b;
      border-radius: 16px;
      padding: 1.3rem 1.2rem 1.5rem;
      border: 2px solid #4c1d95;
    }
    .turn-banner {
      text-align: center;
      font-weight: 800;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      padding: 0.45rem;
      border-radius: 999px;
    }
    .turn-banner.a { background: rgba(124,58,237,0.4); color: #e9d5ff; }
    .turn-banner.b { background: rgba(249,115,22,0.35); color: #ffedd5; }
    .theme-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
      background: #312e81;
      color: #c4b5fd;
      margin-bottom: 0.5rem;
    }
    .q-text {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.45;
      margin-bottom: 1.1rem;
    }
    .opts { display: grid; gap: 0.55rem; }
    .opt {
      text-align: left;
      padding: 0.95rem 1.1rem;
      border-radius: 12px;
      border: 2px solid #4c1d95;
      background: #312e81;
      color: white;
      font-size: 1.05rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .opt:hover:not(:disabled) { border-color: #a78bfa; background: #3b3670; }
    .opt.ok { border-color: #10b981; background: #064e3b; }
    .opt.bad { border-color: #ef4444; background: #7f1d1d; }
    .opt:disabled { cursor: default; }

    .fb {
      margin-top: 0.9rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-weight: 700;
      display: none;
    }
    .fb.show { display: block; }
    .fb.ok { background: #064e3b; color: #6ee7b7; }
    .fb.bad { background: #7f1d1d; color: #fca5a5; }

    .next-row { margin-top: 1rem; text-align: center; }
    .next-btn {
      display: none;
      background: #fbbf24;
      color: #1e1b4b;
      border: none;
      padding: 0.85rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
    }
    .next-btn.show { display: inline-block; }

    /* End */
    .end-panel {
      text-align: center;
      padding: 2rem 1rem;
    }
    .end-panel h2 { font-size: 2rem; margin-bottom: 0.5rem; }
    .winner {
      font-size: 1.8rem;
      font-weight: 900;
      margin: 0.8rem 0;
    }
    .winner.a { color: #c4b5fd; }
    .winner.b { color: #fdba74; }
    .winner.tie { color: #fbbf24; }
    .final-scores {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1.2rem 0;
      font-size: 1.5rem;
      font-weight: 800;
    }
    .replay {
      background: linear-gradient(90deg, #7c3aed, #db2777);
      color: white;
      border: none;
      padding: 0.9rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      margin: 0.3rem;
    }
    .link-back {
      display: inline-block;
      margin-top: 0.8rem;
      color: #a78bfa;
      font-weight: 600;
    }

    .logo-mini {
      height: 28px;
      vertical-align: middle;
      margin-right: 6px;
      background: white;
      border-radius: 6px;
      padding: 2px 4px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .top-bar a { color: #c4b5fd; font-weight: 600; text-decoration: none; }

    @media (max-width: 560px) {
      .team-score { font-size: 1.8rem; }
      .q-text { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="vs-wrap">
    <div class="top-bar">
      <a href="juegos.html">← Juegos</a>
      <span style="font-weight:700;color:#e9d5ff">
        <img src="assets/conamat-icon.png" class="logo-mini" alt="" /> Física Versus
      </span>
    </div>

    <!-- SETUP -->
    <div id="setup" class="setup">
      <h1>⚡ FÍSICA VERSUS</h1>
      <p class="sub">Dos equipos · Preguntas de los 4 temas · ¡Que gane el mejor!</p>

      <div class="name-row">
        <input id="nameA" type="text" value="Equipo Morado" maxlength="18" />
        <span class="vs-badge">VS</span>
        <input id="nameB" type="text" value="Equipo Naranja" maxlength="18" />
      </div>

      <p style="color:#a78bfa;font-weight:600;margin-bottom:0.4rem">Rondas</p>
      <div class="rounds-pick" id="roundsPick">
        <button type="button" data-n="6">6</button>
        <button type="button" data-n="8" class="on">8</button>
        <button type="button" data-n="10">10</button>
        <button type="button" data-n="12">12</button>
      </div>

      <button class="start-btn" onclick="begin()">¡COMENZAR!</button>
      <p style="margin-top:1.2rem;font-size:0.9rem;color:#6b7280">Prof. Fabián Soberanes Martín</p>
    </div>

    <!-- PLAY -->
    <div id="play" style="display:none">
      <div class="board">
        <div class="team-box a" id="boxA">
          <div class="team-name" id="labelA">Equipo A</div>
          <div class="team-score" id="scoreA">0</div>
        </div>
        <div class="mid-info">
          <span class="round-label">RONDA</span>
          <span class="round-num" id="roundNum">1</span>
        </div>
        <div class="team-box b" id="boxB">
          <div class="team-name" id="labelB">Equipo B</div>
          <div class="team-score" id="scoreB">0</div>
        </div>
      </div>

      <div class="q-panel">
        <div class="turn-banner a" id="turnBanner">Turno: Equipo A</div>
        <span class="theme-tag" id="themeTag">Tema</span>
        <div class="q-text" id="qText"></div>
        <div class="opts" id="opts"></div>
        <div class="fb" id="fb"></div>
        <div class="next-row">
          <button class="next-btn" id="nextBtn" onclick="nextRound()">Siguiente ronda →</button>
        </div>
      </div>
    </div>

    <!-- END -->
    <div id="end" class="end-panel" style="display:none">
      <h2>🏁 ¡Fin del Versus!</h2>
      <div class="winner" id="winnerText"></div>
      <div class="final-scores">
        <span id="finalA" style="color:#c4b5fd"></span>
        <span style="color:#6b7280">—</span>
        <span id="finalB" style="color:#fdba74"></span>
      </div>
      <button class="replay" onclick="location.reload()">Revancha</button>
      <br />
      <a class="link-back" href="juegos.html">← Otros juegos</a>
    </div>
  </div>

  <script>
    const BANK = [
      // Tema 1
      { theme: 'Tema 1 · Movimiento', q: 'Das una vuelta a una pista de 400 m y vuelves al inicio. ¿Desplazamiento?', opts: ['400 m', '0 m', '200 m', '800 m'], ok: 1 },
      { theme: 'Tema 1 · Movimiento', q: 'Un auto pasa de 0 a 20 m/s en 5 s. ¿Aceleración?', opts: ['4 m/s²', '100 m/s²', '0.25 m/s²', '25 m/s²'], ok: 0 },
      { theme: 'Tema 1 · Movimiento', q: 'En gráfica x-t, línea horizontal significa:', opts: ['MRU rápido', 'Reposo', 'Aceleración', 'Caída libre'], ok: 1 },
      { theme: 'Tema 1 · Movimiento', q: 'Caída libre (sin aire): la aceleración es ≈', opts: ['0', '1 m/s²', '9.8 m/s² abajo', 'Variable al azar'], ok: 2 },
      { theme: 'Tema 1 · Movimiento', q: '30 m este + 40 m norte. ¿Magnitud del desplazamiento?', opts: ['70 m', '10 m', '50 m', '1200 m'], ok: 2 },
      { theme: 'Tema 1 · Movimiento', q: 'La pendiente de x-t representa:', opts: ['Aceleración', 'Fuerza', 'Velocidad', 'Masa'], ok: 2 },
      // Tema 2
      { theme: 'Tema 2 · Fuerzas', q: '30 N derecha y 10 N izquierda. ¿F_R?', opts: ['40 N der.', '20 N der.', '20 N izq.', '0'], ok: 1 },
      { theme: 'Tema 2 · Fuerzas', q: '1ª ley de Newton = ', opts: ['F = m·a', 'Inercia', 'Acción-reacción', 'P = m·g'], ok: 1 },
      { theme: 'Tema 2 · Fuerzas', q: 'F = 40 N, m = 8 kg. ¿a?', opts: ['5 m/s²', '320 m/s²', '0.2 m/s²', '32 m/s²'], ok: 0 },
      { theme: 'Tema 2 · Fuerzas', q: 'Peso de 60 kg (g = 9.8):', opts: ['60 N', '588 N', '9.8 N', '6.1 N'], ok: 1 },
      { theme: 'Tema 2 · Fuerzas', q: 'E_c de 3 kg a 4 m/s:', opts: ['12 J', '24 J', '48 J', '6 J'], ok: 1 },
      { theme: 'Tema 2 · Fuerzas', q: 'Si F_R = 0, el cuerpo:', opts: ['Siempre quieto', 'Equilibrio (reposo o MRU)', 'Acelera', 'Solo cae'], ok: 1 },
      // Tema 3
      { theme: 'Tema 3 · Interacciones', q: 'Temperatura mide (modelo cinético):', opts: ['Energía total', 'Energía cinética promedio de partículas', 'Solo volumen', 'Color'], ok: 1 },
      { theme: 'Tema 3 · Interacciones', q: 'El Sol calienta la Tierra por:', opts: ['Conducción', 'Convección', 'Radiación', 'Contacto'], ok: 2 },
      { theme: 'Tema 3 · Interacciones', q: 'P = F/A. F = 80 N, A = 0.2 m² → P =', opts: ['16 Pa', '400 Pa', '80.2 Pa', '4 Pa'], ok: 1 },
      { theme: 'Tema 3 · Interacciones', q: 'Principio de Pascal: la presión…', opts: ['Solo hacia abajo', 'Se transmite en todas direcciones', 'No se transmite', 'Solo en gases'], ok: 1 },
      { theme: 'Tema 3 · Interacciones', q: 'Gato hidráulico: A₂ = 10·A₁, F₁ = 25 N → F₂ =', opts: ['2.5 N', '25 N', '250 N', '2500 N'], ok: 2 },
      { theme: 'Tema 3 · Interacciones', q: 'Un cuchillo corta mejor porque:', opts: ['Es más pesado', 'Menor área → mayor presión', 'Está frío', 'No hay fuerza'], ok: 1 },
      // Tema 4
      { theme: 'Tema 4 · Estructura', q: 'Buen conductor eléctrico:', opts: ['Goma', 'Cobre', 'Plástico', 'Vidrio'], ok: 1 },
      { theme: 'Tema 4 · Estructura', q: 'V = 18 V, R = 6 Ω. ¿I?', opts: ['108 A', '3 A', '12 A', '0.33 A'], ok: 1 },
      { theme: 'Tema 4 · Estructura', q: 'Una corriente eléctrica genera:', opts: ['Solo calor', 'Campo magnético', 'Gravedad', 'Nada'], ok: 1 },
      { theme: 'Tema 4 · Estructura', q: 'λ = 4 m, f = 10 Hz → v =', opts: ['0.4 m/s', '40 m/s', '14 m/s', '2.5 m/s'], ok: 1 },
      { theme: 'Tema 4 · Estructura', q: 'En un prisma, el color que más se desvía es:', opts: ['Rojo', 'Verde', 'Violeta', 'Todos igual'], ok: 2 },
      { theme: 'Tema 4 · Estructura', q: 'Inducción de Faraday necesita:', opts: ['Imán quieto', 'Campo magnético que cambie', 'Solo aislamiento', '0 K'], ok: 1 }
    ];

    let totalRounds = 8;
    let round = 0;
    let turn = 0; // 0 = A, 1 = B
    let scoreA = 0, scoreB = 0;
    let nameA = 'Equipo Morado', nameB = 'Equipo Naranja';
    let deck = [];
    let answered = false;

    document.querySelectorAll('#roundsPick button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#roundsPick button').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        totalRounds = parseInt(btn.dataset.n, 10);
      });
    });

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function begin() {
      nameA = (document.getElementById('nameA').value || 'Equipo A').trim();
      nameB = (document.getElementById('nameB').value || 'Equipo B').trim();
      document.getElementById('labelA').textContent = nameA;
      document.getElementById('labelB').textContent = nameB;
      scoreA = 0; scoreB = 0; round = 0; turn = 0;
      document.getElementById('scoreA').textContent = '0';
      document.getElementById('scoreB').textContent = '0';
      deck = shuffle(BANK).slice(0, totalRounds);
      document.getElementById('setup').style.display = 'none';
      document.getElementById('end').style.display = 'none';
      document.getElementById('play').style.display = 'block';
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      const q = deck[round];
      document.getElementById('roundNum').textContent = (round + 1) + '/' + totalRounds;
      document.getElementById('themeTag').textContent = q.theme;
      document.getElementById('qText').textContent = q.q;

      const isA = turn === 0;
      const banner = document.getElementById('turnBanner');
      banner.className = 'turn-banner ' + (isA ? 'a' : 'b');
      banner.textContent = '🎯 Turno: ' + (isA ? nameA : nameB);

      document.getElementById('boxA').classList.toggle('active', isA);
      document.getElementById('boxB').classList.toggle('active', !isA);

      const opts = document.getElementById('opts');
      opts.innerHTML = '';
      q.opts.forEach((text, i) => {
        const b = document.createElement('button');
        b.className = 'opt';
        b.textContent = text;
        b.onclick = () => pick(i);
        opts.appendChild(b);
      });

      const fb = document.getElementById('fb');
      fb.className = 'fb';
      fb.textContent = '';
      document.getElementById('nextBtn').classList.remove('show');
    }

    function pick(i) {
      if (answered) return;
      answered = true;
      const q = deck[round];
      const btns = document.querySelectorAll('.opt');
      btns.forEach((b, j) => {
        b.disabled = true;
        if (j === q.ok) b.classList.add('ok');
        if (j === i && i !== q.ok) b.classList.add('bad');
      });

      const fb = document.getElementById('fb');
      fb.classList.add('show');
      const correct = i === q.ok;
      if (correct) {
        if (turn === 0) { scoreA += 10; document.getElementById('scoreA').textContent = scoreA; }
        else { scoreB += 10; document.getElementById('scoreB').textContent = scoreB; }
        fb.classList.add('ok');
        fb.textContent = '✅ ¡Correcto! +10 puntos';
      } else {
        fb.classList.add('bad');
        fb.textContent = '❌ Incorrecto. Respuesta: ' + q.opts[q.ok];
      }
      document.getElementById('nextBtn').classList.add('show');
    }

    function nextRound() {
      // Alternate turns each question
      turn = 1 - turn;
      round++;
      if (round >= totalRounds) {
        finish();
        return;
      }
      showQuestion();
    }

    function finish() {
      document.getElementById('play').style.display = 'none';
      document.getElementById('end').style.display = 'block';
      document.getElementById('finalA').textContent = nameA + ': ' + scoreA;
      document.getElementById('finalB').textContent = nameB + ': ' + scoreB;
      const w = document.getElementById('winnerText');
      if (scoreA > scoreB) {
        w.className = 'winner a';
        w.textContent = '🏆 ¡Gana ' + nameA + '!';
      } else if (scoreB > scoreA) {
        w.className = 'winner b';
        w.textContent = '🏆 ¡Gana ' + nameB + '!';
      } else {
        w.className = 'winner tie';
        w.textContent = '🤝 ¡Empate!';
      }
    }
  </script>
</body>
</html>
